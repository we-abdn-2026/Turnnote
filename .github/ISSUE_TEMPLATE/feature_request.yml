name: 功能建议
description: 提出新功能或改进现有功能
title: '[Feature] '
labels: ['type/feature']
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 用户在什么场景下遇到什么问题
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: dropdown
    id: groups
    attributes:
      label: 涉及分组
      description: 自动添加 group/ 标签
      multiple: true
      options:
        - frontend · 前端
        - backend · 后端
        - testing · 测试
        - deploy · 部署
    validations:
      required: true
  - type: dropdown
    id: areas
    attributes:
      label: 涉及模块
      description: 自动添加 area/ 标签
      multiple: true
      options:
        - audio · 音频采集
        - asr · 本地转写
        - deepseek · 纪要生成
        - database · 数据库与存储
        - ipc · 进程通信与契约
        - ui · 界面与交互
        - export · 导出
        - security · 凭证与隐私
        - packaging · 打包与安装
        - ci · CI 与工程配置
        - docs · 文档
  - type: dropdown
    id: scope
    attributes:
      label: MVP 范围
      description: 对照 docs/roadmap.md 的「MVP 范围外」
      options:
        - 属于 MVP
        - 不属于 MVP，发布后考虑
        - 不确定
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
