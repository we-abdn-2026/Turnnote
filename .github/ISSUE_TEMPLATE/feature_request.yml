name: 功能建议
description: 提出新功能或改进现有功能
title: '[Feature] '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 用户在什么场景下遇到什么问题
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: dropdown
    id: groups
    attributes:
      label: 涉及分组
      multiple: true
      options:
        - 前端
        - 后端
        - 测试
        - 部署
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: MVP 范围
      description: 对照 docs/roadmap.md 的「MVP 范围外」
      options:
        - 属于 MVP
        - 不属于 MVP，发布后考虑
        - 不确定
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
