name: 缺陷报告
description: 报告功能异常、崩溃或数据问题
title: '[Bug] '
labels: ['type/bug']
body:
  - type: markdown
    attributes:
      value: 请勿粘贴 API Key、会议转写原文或包含用户名的完整本地路径。
  - type: dropdown
    id: area
    attributes:
      label: 模块
      description: 自动添加 area/ 标签；不确定可多选
      multiple: true
      options:
        - audio · 音频采集
        - asr · 本地转写
        - deepseek · 纪要生成
        - database · 会议数据与存储
        - ipc · 进程通信
        - ui · 界面与交互
        - export · 导出
        - security · 凭证与隐私
        - packaging · 安装与启动
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      description: 自动添加 priority/ 标签；不确定可不选，由维护者判断
      options:
        - P0 · 阻塞：主流程不可用或数据丢失
        - P1 · 高：影响当前里程碑
        - P2 · 中：当前阶段内处理
        - P3 · 低：有空再做
  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - macOS arm64
        - macOS x64
        - Windows x64
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: 系统版本
      placeholder: macOS 14.5 / Windows 11 23H2
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: 应用版本或 commit
      placeholder: 0.1.0 / 9415c47
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: dropdown
    id: data-loss
    attributes:
      label: 是否丢失数据
      description: 录音、转写或纪要编辑内容是否丢失
      options:
        - 否
        - 是
        - 不确定
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或错误码
      description: 已去除敏感信息的相关日志
      render: text
