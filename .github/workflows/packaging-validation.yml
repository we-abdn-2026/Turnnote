name: Packaging validation

on:
  pull_request:
    paths:
      - '.github/workflows/packaging-validation.yml'
      - 'apps/desktop/main/**'
      - 'services/asr-worker/**'
      - 'scripts/build-sidecar.mjs'
      - 'scripts/check-package-target.mjs'
      - 'electron-builder.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'requirements-dev.txt'

permissions:
  contents: read

jobs:
  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: npm ci
      - run: pip install -r requirements-dev.txt
      - run: npm run package:mac:arm64
      - name: Install and validate DMG
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/turnnote-dmg" "$RUNNER_TEMP/turnnote-installed"
          hdiutil attach dist-packaging/Turnnote-0.1.0-arm64.dmg \
            -nobrowse -readonly -mountpoint "$RUNNER_TEMP/turnnote-dmg"
          ditto "$RUNNER_TEMP/turnnote-dmg/Turnnote.app" \
            "$RUNNER_TEMP/turnnote-installed/Turnnote.app"
          "$RUNNER_TEMP/turnnote-installed/Turnnote.app/Contents/MacOS/Turnnote" \
            --packaging-smoke --user-data-dir="$RUNNER_TEMP/turnnote-user-data"
          cat "$RUNNER_TEMP/turnnote-user-data/packaging-validation.json"
          hdiutil detach "$RUNNER_TEMP/turnnote-dmg"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: turnnote-macos-arm64
          path: |
            dist-packaging/*.dmg
            ${{ runner.temp }}/turnnote-user-data/packaging-validation.json

  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: npm ci
      - run: pip install -r requirements-dev.txt
      - run: npm run package:win:x64
      - name: Install and validate NSIS package
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist-packaging -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not generated.' }
          $installDir = Join-Path $env:RUNNER_TEMP 'turnnote-installed'
          $installation = Start-Process -FilePath $installer.FullName `
            -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($installation.ExitCode -ne 0) {
            throw "NSIS installer failed with exit code $($installation.ExitCode)."
          }

          $executable = Join-Path $installDir 'Turnnote.exe'
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw "Installed executable was not found at $executable."
          }

          # Negative control: prove that an application self-check failure produces
          # a non-zero exit code before accepting the normal validation result.
          $failureUserData = Join-Path $env:RUNNER_TEMP 'turnnote-user-data-failure'
          $failure = Start-Process -FilePath $executable `
            -ArgumentList @(
              '--packaging-smoke',
              '--packaging-smoke-force-failure',
              "--user-data-dir=$failureUserData"
            ) -Wait -PassThru
          if ($failure.ExitCode -eq 0) {
            throw 'Intentional packaging smoke-test failure returned exit code 0.'
          }

          $userData = Join-Path $env:RUNNER_TEMP 'turnnote-user-data'
          $smoke = Start-Process -FilePath $executable `
            -ArgumentList @('--packaging-smoke', "--user-data-dir=$userData") `
            -Wait -PassThru
          if ($smoke.ExitCode -ne 0) {
            throw "Packaging smoke test failed with exit code $($smoke.ExitCode)."
          }

          $reportPath = Join-Path $userData 'packaging-validation.json'
          if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) {
            throw "Packaging validation report was not found at $reportPath."
          }
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          if ($report.platform -ne 'win32') {
            throw "Unexpected report platform: $($report.platform)."
          }
          if ($report.architecture -ne 'x64') {
            throw "Unexpected report architecture: $($report.architecture)."
          }
          if ($report.sqlite -ne 'ok') {
            throw "SQLite validation failed: $($report.sqlite)."
          }
          if ($report.sidecar -ne 'ok') {
            throw "Sidecar validation failed: $($report.sidecar)."
          }
          $report | ConvertTo-Json -Depth 5
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: turnnote-windows-x64
          path: |
            dist-packaging/*.exe
            ${{ runner.temp }}/turnnote-user-data/packaging-validation.json
