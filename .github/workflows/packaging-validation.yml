name: Packaging validation

on:
  pull_request:
    paths:
      - '.github/workflows/packaging-validation.yml'
      - 'apps/desktop/main/**'
      - 'services/asr-worker/**'
      - 'scripts/build-sidecar.mjs'
      - 'scripts/prepare-asr-validation-model.py'
      - 'scripts/validate-bundled-sidecar.py'
      - 'scripts/check-package-target.mjs'
      - 'scripts/verify-package-contents.mjs'
      - 'scripts/validate-installed-package.ps1'
      - 'electron-builder.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'requirements-dev.txt'
      - 'requirements.txt'
      - 'tests/fixtures/sample-en.wav'

permissions:
  contents: read

jobs:
  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: npm ci
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: npm run test:electron
      - run: npm run package:mac:arm64
      - run: node scripts/verify-package-contents.mjs dist-packaging/mac-arm64/Turnnote.app
      - name: Install and validate DMG
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/turnnote-dmg" "$RUNNER_TEMP/turnnote-installed"
          hdiutil attach dist-packaging/Turnnote-0.1.0-arm64.dmg \
            -nobrowse -readonly -mountpoint "$RUNNER_TEMP/turnnote-dmg"
          ditto "$RUNNER_TEMP/turnnote-dmg/Turnnote.app" \
            "$RUNNER_TEMP/turnnote-installed/Turnnote.app"

          worker="$RUNNER_TEMP/turnnote-installed/Turnnote.app/Contents/Resources/asr-worker/asr-worker"
          disabled="$worker.validation-disabled"
          mv "$worker" "$disabled"
          trap 'test ! -e "$disabled" || mv "$disabled" "$worker"' EXIT
          set +e
          "$RUNNER_TEMP/turnnote-installed/Turnnote.app/Contents/MacOS/Turnnote" \
            --packaging-smoke --user-data-dir="$RUNNER_TEMP/turnnote-user-data-failure"
          rejected=$?
          set -e
          test "$rejected" -eq 1
          mv "$disabled" "$worker"
          trap - EXIT
          node -e 'const fs = require("node:fs"); const r = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (r.platform !== "darwin" || r.architecture !== "arm64" || r.sqlite !== "ok" || r.sidecar !== "failed" || r.sidecarResource !== "asr-worker/asr-worker" || Object.hasOwn(r, "sidecarPath") || r.electronVersion === "unknown" || !/^\d+$/.test(r.modulesAbi)) process.exit(1); console.log(JSON.stringify(r, null, 2));' \
            "$RUNNER_TEMP/turnnote-user-data-failure/packaging-validation.json"

          "$RUNNER_TEMP/turnnote-installed/Turnnote.app/Contents/MacOS/Turnnote" \
            --packaging-smoke --user-data-dir="$RUNNER_TEMP/turnnote-user-data"
          node -e 'const fs = require("node:fs"); const r = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (r.platform !== "darwin" || r.architecture !== "arm64" || r.sqlite !== "ok" || r.sidecar !== "ok" || r.sidecarResource !== "asr-worker/asr-worker" || Object.hasOwn(r, "sidecarPath") || r.electronVersion === "unknown" || !/^\d+$/.test(r.modulesAbi)) process.exit(1); console.log(JSON.stringify(r, null, 2));' \
            "$RUNNER_TEMP/turnnote-user-data/packaging-validation.json"
          hdiutil detach "$RUNNER_TEMP/turnnote-dmg"
      - name: Validate installed worker with local tiny model
        shell: bash
        run: |
          python scripts/prepare-asr-validation-model.py "$RUNNER_TEMP/turnnote-asr-model"
          python scripts/validate-bundled-sidecar.py \
            --worker "$RUNNER_TEMP/turnnote-installed/Turnnote.app/Contents/Resources/asr-worker/asr-worker" \
            --model "$RUNNER_TEMP/turnnote-asr-model" \
            --audio tests/fixtures/sample-en.wav \
            --report "$RUNNER_TEMP/turnnote-asr-validation.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          if-no-files-found: error
          name: turnnote-macos-arm64
          path: |
            dist-packaging/*.dmg
            build/sidecar/asr-worker/**
            ${{ runner.temp }}/turnnote-user-data/packaging-validation.json
            ${{ runner.temp }}/turnnote-user-data-failure/packaging-validation.json
            ${{ runner.temp }}/turnnote-asr-validation.json

  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: npm ci
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: npm run test:electron
      - run: npm run package:win:x64
      - run: node scripts/verify-package-contents.mjs dist-packaging/win-unpacked
      - name: Install and validate NSIS package
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist-packaging -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not generated.' }
          $installDir = Join-Path $env:RUNNER_TEMP 'turnnote-installed'
          $installation = Start-Process -FilePath $installer.FullName `
            -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($installation.ExitCode -ne 0) {
            throw "NSIS installer failed with exit code $($installation.ExitCode)."
          }

          # Include spaces to exercise Windows argument quoting.
          ./scripts/validate-installed-package.ps1 -InstallDir $installDir `
            -UserDataRoot (Join-Path $env:RUNNER_TEMP 'turnnote user data')
      - name: Validate installed worker with local tiny model
        shell: pwsh
        run: |
          python scripts/prepare-asr-validation-model.py (Join-Path $env:RUNNER_TEMP 'turnnote-asr-model')
          python scripts/validate-bundled-sidecar.py `
            --worker (Join-Path $env:RUNNER_TEMP 'turnnote-installed\resources\asr-worker\asr-worker.exe') `
            --model (Join-Path $env:RUNNER_TEMP 'turnnote-asr-model') `
            --audio tests/fixtures/sample-en.wav `
            --report (Join-Path $env:RUNNER_TEMP 'turnnote-asr-validation.json')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          if-no-files-found: error
          name: turnnote-windows-x64
          path: |
            dist-packaging/*.exe
            build/sidecar/asr-worker/**
            ${{ runner.temp }}/turnnote user data/packaging-validation.json
            ${{ runner.temp }}/turnnote user data-failure/packaging-validation.json
            ${{ runner.temp }}/turnnote-asr-validation.json
