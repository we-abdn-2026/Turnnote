name: Issue labels

# 根据 issue 表单的分组、模块、优先级字段添加 group/、area/、priority/ 标签。
# 选项格式为「token · 中文说明」，只取 token；只添加仓库中已存在的标签。
on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const prefixes = {
              分组: 'group',
              涉及分组: 'group',
              模块: 'area',
              涉及模块: 'area',
              优先级: 'priority',
            };
            const body = context.payload.issue.body ?? '';
            const wanted = new Set();
            for (const section of body.split(/^###\s+/m).slice(1)) {
              const [heading, ...rest] = section.split('\n');
              const prefix = prefixes[heading.trim()];
              if (!prefix) continue;
              for (const match of rest.join('\n').matchAll(/([A-Za-z0-9]+)\s*·/g)) {
                wanted.add(`${prefix}/${match[1]}`);
              }
            }
            if (wanted.size === 0) return;

            const existing = await github.paginate(github.rest.issues.listLabelsForRepo, {
              ...context.repo,
              per_page: 100,
            });
            const names = new Set(existing.map((label) => label.name));
            const labels = [...wanted].filter((name) => names.has(name));
            if (labels.length === 0) return;
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: context.payload.issue.number,
              labels,
            });
